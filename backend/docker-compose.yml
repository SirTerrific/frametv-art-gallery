services:
  frametv:
    image: ghcr.io/sirterrific/frametv-art-gallery:latest
    container_name: frametv_artgallery
    restart: always
    volumes:
      - frametv_data:/data

    # The host network is what lets the app find TVs by itself, and what lets it wake
    # one: both use UDP broadcast, which never leaves the bridge. On the bridge you can
    # still add a TV by typing its address — everything else works the same.
    network_mode: host

    # Swap the two blocks above and below to go back to the bridge.
    # ports:
    #   - "8000:8000"

    environment:
      - SECRET_KEY=supersecretkey
      - FRAME_TV_DATA=/data
      # On the host network there is no mapping to move the app with, so change the
      # port here if 8000 is taken.
      - PORT=8000

volumes:
  frametv_data:
