name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch: 

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write
  issues: write
  attestations: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple
      - name: Append Footer to GitHub Release Notes
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          gh release view "$TAG_NAME" --json body --jq '.body' > current_release_notes.md
          
          echo -e "\n\n---\n⭐ **Enjoying the project?** Drop us a [star on GitHub](https://github.com/mrtncode/frametv-art-gallery) and share it with others!" >> current_release_notes.md
          
          gh release edit "$TAG_NAME" --notes-file current_release_notes.md

  trigger-build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/build_image.yaml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}

